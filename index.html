    <div class="alan"><label for="form.musteri">Müşteri</label><div class="giris"><input id="form.musteri" data-form="musteri" value="${esc(f.musteri)}" autocomplete="off" list="musteri-listesi"></div></div>
    <div class="alan genis"><label for="form.not">Not</label><div class="giris"><input id="form.not" data-form="not" value="${esc(f.not)}" autocomplete="off"></div></div>
  </div><datalist id="musteri-listesi">${[...new Set(S.kayit.map(r=>r.musteri).filter(Boolean))].map(m=>`<option value="${esc(m)}">`).join('')}</datalist>
  <div class="kaydet-alt"><button class="dugme" id="kaydet">Kayda ekle</button><span class="bildirim" id="bildirim"></span></div></div>`;
}
function yontem(){
  return `<details><summary>Hesap yöntemi ve doğruluk</summary>
  <p>Saf gazlarda her gaz için referans Helmholtz hal denklemi kullanılır: oksijen Schmidt ve Wagner, argon Tegeler, azot Span, karbondioksit Span ve Wagner, karbonmonoksit ve azot protoksit Lemmon ve Span, helyum Ortiz-Vega, hidrojen Leachman, metan Setzmann ve Wagner, kuru hava Lemmon, sülfürdioksit Gao. Karışımlarda GERG-2008 indirgeme fonksiyonları ve ölçüme dayalı ikili ayrılma fonksiyonları kullanılır. Denklem katsayıları CoolProp 8.0 veri tabanından alınmış, bu program CoolProp ile 0,0001 % içinde uyumlu çıkacak şekilde test edilmiştir.</p>
  <ul>
    <li>Bu denklemlerin gaz bölgesindeki yoğunluk belirsizliği tipik olarak %0,02 ile %0,1 arasındadır. Pratikte asıl hata kaynağı ölçümdür: 200 bar'da 1 bar manometre hatası yaklaşık %0,5, 1 °C sıcaklık hatası yaklaşık %0,35 kütle hatası yaratır.</li>
    <li>Tüp su hacmi damgalı değerden birkaç yüzde farklı olabilir ve basınç altında tüp çok az genleşir; kesin sonuç gereken durumlarda tartım en güvenilir yöntemdir.</li>
    <li>Azot monoksit için referans denklem bulunmadığından karşılıklı haller yaklaşımı kullanılır (saf NO'da yaklaşık ±%2). Asetilenin referans yoğunluğu ikinci virial katsayısıyla hesaplanır.</li>
    <li>Karışımlarda ayrışma uyarısı Peng–Robinson denklemiyle yapılan kararlılık testine dayanır ve yalnızca uyarı amaçlıdır. "Tek faz sınırı", tüp dolum basıncından boşalana kadar geçtiği tüm basınçlarda karışımın sıvı ayrıştırmaya başladığı en yüksek sıcaklıktır; tüp bu sıcaklığın üstünde depolanıp kullanıldığı sürece çekilen gazın oranı değişmez. CO₂–N₂ ve CO₂–Ar karışımlarında GERG-2008 faz zarfıyla birkaç derece içinde uyumludur.</li>
    <li>Manometre kontrolünde hedef basınç, sizin girdiğiniz hedef sıcaklığındaki (genellikle 15 °C) dolum basıncıdır. Program aynı gaz miktarının termometre sıcaklığında göstermesi gereken basıncı hesaplar ve okunan değeri kabul aralığıyla karşılaştırır. Termometre tüp yüzeyini ölçer; hızlı dolumda içerideki gaz daha sıcak olduğundan basınç bir süre yüksek görünür.</li>
    <li>Siparişten modunda denge gazı miktarı, karışımın hedef basınç ve sıcaklıkta tüpü tam dolduracağı toplam madde miktarı gerçek gaz denklemiyle çözülerek bulunur. Tartım belirsizliği terazi çözünürlüğünün eklenen kütleye oranıdır; ara karışım önerisi her tartımda en az 200 çözünürlük adımı hedefler.</li>
    <li>Standart m³ her bileşenin referans şarttaki gerçek gaz yoğunluğu ile hesaplanır; karışımda bileşen hacimleri toplanır.</li>
  </ul></details>`;
}

function hesapla(){
  bekleyenGrafik=null;
  if(S.sekme==='tek') hesaplaTek(); else if(S.sekme==='karisim') hesaplaKar();
  sonrasi();
}
let bekleyenGrafik=null;
function sonrasi(){
  const s=$('#sonuc'); if(!s) return;
  Gorsel.ibreyiOynat(s);
  const oz=$('#ozet'), db=s.querySelector('.durum-baslik');
  if(oz){ if(db){ const satir=s.querySelector('.kontrol dd'); oz.hidden=false; oz.style.borderColor=db.style.color; oz.innerHTML=`<span style="color:${db.style.color}">${db.textContent}</span>${satir?` <span class="yan">beklenen ${satir.textContent}</span>`:''} <a href="#sonuc">Sonuca git</a>`; } else oz.hidden=true; }
  if(bekleyenGrafik) Gorsel.grafik($('#grafik'),bekleyenGrafik);
}
const pG=Pa=>barG(Pa);
function fP(Pa){ const v=barG(Pa); return `${fmt(v,Math.abs(v)<20?2:1)} ${birimP()}`; }
function fBar(dPa){ const v=Math.abs(dPa)/1e5; return fmt(v,v<2?2:1); }
function sicakliklar(...Tlar){ const v=Tlar.filter(x=>isFinite(x)); const lo=Math.min(...v), hi=Math.max(...v); const a=Math.min(-20,Math.floor((lo-10)/10)*10), b=Math.max(60,Math.ceil((hi+10)/10)*10); const out=[]; for(let x=a;x<=b+1e-9;x+=1) out.push(x); return out; }

// Manometre kontrol bölümü
function kontrolBlok(o){
  // o: {durum, baslik, metin, satirlar:[[a,b]], kadran:{...}, grafik:cfg, lejant:[[tur,ad]]}
  let h=`<h2>Manometre kontrolü</h2><section class="kontrol">`;
  h+=`<div class="kadran-kap">${Gorsel.kadran({birim:birimP(),...o.kadran,durum:o.durum})}</div>`;
  h+=`<div class="kontrol-metin"><div class="durum-baslik" style="color:${Gorsel.RENK[o.durum]}"><span class="durum-isaret" style="background:${Gorsel.RENK[o.durum]}"></span>${o.baslik}</div><p>${o.metin}</p>`;
  if(o.satirlar&&o.satirlar.length) h+=`<dl class="ayrinti tek-sutun">${o.satirlar.map(([a,b])=>satirD(a,b)).join('')}</dl>`;
  h+=`</div></section>`;
  if(o.grafik){
    bekleyenGrafik=o.grafik;
    h+=`<div class="grafik-kap"><div class="grafik-baslik">Sıcaklığa göre basınç</div><div id="grafik"></div><div class="lejant">${(o.lejant||[]).map(([tur,ad])=>`<span><i class="lj lj-${tur}" ${tur==='kesik'?`style="border-color:${Gorsel.RENK[o.durum]}"`:''}></i>${ad}</span>`).join('')}</div></div>`;
  }
  return h;
}

function ayrismaMetni(ay){ return ay?`${fmt(ay.T-273.15,0)} °C <span class="yan">en riskli an: tüp ~${fmt(ay.P/1e5,0)} bar a</span>`:''; }
function hesaplaTek(){
  const t=S.tek, g=t.gaz, R=ref();
  if(C.LIQ.includes(g)||g==='C2H2') return hesaplaSivi();
  // Basınçlı
  const V=num(t.V), Pr=num(t.P), T=num(t.T), hedef=num(t.hedef), tol=num(t.tol), hT=num(t.hT), tT=num(t.tT);
  const bosP=isNaN(Pr);
  if(!(V>0)||isNaN(T)) return hata('Tüp su hacmi ve sıcaklığı girin.');
  if(T<-60||T>150) return hata('Sıcaklık -60 ile 150 °C arasında olmalı.');
  if(bosP && isNaN(hedef)) return hata('Okunan basıncı ya da hedef basıncı girin.');
  let comps=[{key:g,x:1}];
  if(g==='SAIR'){ const o=num(t.o2); if(!(o>0&&o<100)) return hata('Oksijen oranını 0 ile 100 arasında girin.'); comps=[{key:'N2',x:1-o/100},{key:'O2',x:o/100}]; }
  let kalan=null;
  if(t.kalan){ const kp=num(t.kP), kt=num(t.kT); if(isNaN(kp)||isNaN(kt)) return hata('Kalan gaz basıncı ve sıcaklığını girin.'); kalan={P_abs:absPa(kp),T:kt+273.15}; if(!(kalan.P_abs>0)) kalan=null; }
  const sonuc=basincliHesap({comps,V,Pr,T,hedef,hT,tT,tol,kalan,ad:GAZ[g].ad,parca:comps.length>1});
  if(!sonuc) return;
  sonHesap=bosP?null:{gaz:GAZ[g].ad+(g==='SAIR'?` (%${fmt(num(t.o2),1)} O₂)`:''),yontem:'Basınç',V,P:`${fmt(Pr,1)} ${birimP()}`,T,m3:sonuc.m3,kg:sonuc.kg,bilesen:g==='SAIR'?bilesenMetni(sonuc.parts):'',Pdeger:Pr,comps:comps.map(c=>({key:c.key,x:c.x})),parts:parcaOzet(sonuc.parts),kalan};
}

// Basınçlı tek gaz ve basınçla karışım için ortak akış
function basincliHesap(o){
  const R=ref(), TK=o.T+273.15, bosP=isNaN(o.Pr);
  if(!isNaN(o.hedef) && isNaN(o.hT)){ hata('Hedef basıncın hangi sıcaklıkta geçerli olduğunu girin (genellikle 15 °C).'); return null; }
  const hTK=o.hT+273.15, tTK=isNaN(o.tT)?null:o.tT+273.15, H1=fmt(o.hT,1), TT1=isNaN(o.tT)?'':fmt(o.tT,1);
  const hedefPa=!isNaN(o.hedef)?absPa(o.hedef):null;
  const bek=hedefPa&&hedefPa>0?C.expectedAt(o.comps,hedefPa,TK,hTK):null;
  if(bosP && !bek){ hata('Hedef basınç için çözüm bulunamadı.'); return null; }
  const Pa=bosP?bek.p:absPa(o.Pr);
  if(!(Pa>0)){ hata('Mutlak basınç sıfırdan büyük olmalı.'); return null; }
  const r=C.byPressure({comps:o.comps,V_L:o.V,P_abs:Pa,Pg_bar:barG(Pa)+(S.olcum==='g'?0:-S.patm),T:TK,ref:R,residual:o.kalan,target15_abs:hedefPa,hedefT:isNaN(o.hT)?288.15:hTK,tahminT:tTK});
  if(r.error){ hata(r.error); return null; }
  const etiket=bosP?(o.kalan?'Hedefte dolacak':'Hedef dolumda'):(o.kalan?'Dolan':'Tüpteki');
  let h=gosterge(etiket,r.m3,r.kg,`1 m³ = ${fmt(r.kgTot/r.m3Tot,4)} kg`,`Tüp içinde ${fmt(r.rho_kgm3,1)} kg/m³`)+uyarilar(r.warn);
  // kontrol
  const Ts=sicakliklar(o.T,o.hT,o.tT);
  const tolPa=(o.tol>=0?o.tol:0)*1e5;
  if(bek){
    const patmPa=S.patm*1e5*(S.olcum==='g'?1:0);
    const kontrol=C.checkCompressed({P_read:bosP?null:Pa,P_exp:bek.p,P15_read:r.P15,target15_abs:hedefPa,tolPa,patmPa:S.patm*1e5});
    const kirmiziHedef=S.patm*1e5+(hedefPa-S.patm*1e5)*1.10;
    const kirmizi=C.expectedAt(o.comps,Math.max(kirmiziHedef,hedefPa+tolPa),TK,hTK);
    const hedefEgri=C.isochore(o.comps,bek.rho,Ts.map(x=>x+273.15)).map(pG);
    const grafik={Ts,birim:birimP(),egriler:[{v:hedefEgri,tur:'ana'}],bant:{alt:hedefEgri.map(v=>v-tolPa/1e5),ust:hedefEgri.map(v=>v+tolPa/1e5)},nokta:{T:o.T,P:pG(Pa),durum:kontrol.status,bos:bosP},dikey:[{T:o.hT,ad:`hedef ${H1} °C`}],sifirdan:false};
    if(tTK) grafik.ekNoktalar=[{T:o.tT,P:pG(r.Ptahmin),ad:`${TT1} °C`}];
    const lejant=[['ana','Hedef dolum'],['bant','Kabul aralığı']];
    if(!bosP){ grafik.egriler.push({v:C.isochore(o.comps,r.rho,Ts.map(x=>x+273.15)).map(pG),tur:'kesik'}); lejant.push(['kesik','Bu tüp']); }
    const T1=fmt(o.T,1), bant=`${fP(kontrol.band[0])} ile ${fP(kontrol.band[1])}`;
    const M={
      beklenen:['Beklenen basınç',`${T1} °C'de manometre <b>${fP(bek.p)}</b> göstermeli. Tüp ${H1} °C'de ${fP(hedefPa)} gösterir.`],
      normal:['Normal',`Okunan basınç ${T1} °C için beklenen aralıkta. Tüp ${H1} °C'de ${fP(r.P15)} gösterir.`],
      dusuk:['Hedefin altında',`Tüp ${H1} °C'de ${fP(r.P15)} gösterecek, hedefe ${fBar(kontrol.d15)} bar eksik. Dolum sürüyorsa devam edin. Dolu bir tüpse eksik dolum ya da kaçak olabilir; termometre tüpü gazdan sıcak ölçüyorsa da böyle görünür.`],
      yuksek:['Hedefin üstünde',`Tüp ${H1} °C'de ${fP(r.P15)} gösterecek, hedefi ${fBar(kontrol.d15)} bar aşıyor. Tüp yeni dolduysa içerideki gaz duvardan sıcaktır, soğuduktan sonra tekrar ölçün. Dengelendikten sonra da yüksekse fazla gazı alın.`],
      asiri:['Aşırı dolum',`Tüp ${H1} °C'de ${fP(r.P15)} gösterecek, hedefin %${fmt((r.P15-hedefPa)/(hedefPa-S.patm*1e5)*100,0)} üzerinde. Dolumu durdurun, sıcaklık dengelenince tekrar ölçün ve hâlâ yüksekse fazla gazı güvenli şekilde tahliye edin.`]
    }[kontrol.status];
    const satir=[[`${T1} °C'de beklenen`,fP(bek.p)],['Kabul aralığı',bant]];
    if(!bosP) satir.push([`${H1} °C'de olacak basınç`,fP(r.P15)]);
    if(tTK) satir.push([`${TT1} °C'de olacak basınç`,fP(r.Ptahmin)]);
    h+=kontrolBlok({durum:kontrol.status,baslik:M[0],metin:M[1],satirlar:satir,kadran:{okunan:bosP?null:pG(Pa),beklenen:pG(bek.p),bant:kontrol.band.map(pG),kirmizi:kirmizi?pG(kirmizi.p):null},grafik,lejant});
  }
  // ayrıntı
  const pratikFark=(r.practical/r.m3Tot-1)*100;
  h+=`<h2>Ayrıntılar</h2><dl class="ayrinti">`;
  if(o.kalan) h+=satirD('Tüpteki toplam',`${fmt(r.m3Tot,3)} m³, ${fmt(r.kgTot,3)} kg`)+satirD('Önceden kalan',`${fmt(r.m3Tot-r.m3,3)} m³, ${fmt(r.kgTot-r.kg,3)} kg`);
  h+=satirD('Sıkıştırılabilirlik faktörü Z',fmt(r.Z,4));
  h+=satirD('Madde miktarı',`${fmt(r.nTot/1000,3)} kmol`);
  if(r.ayrisma) h+=satirD('Tek faz sınırı (tüp boşalırken)',ayrismaMetni(r.ayrisma));
  if(!bek && tTK) h+=satirD(`${TT1} °C'de olacak basınç`,fP(r.Ptahmin));
  h+=satirD('Basınç × su hacmi pratiği',`${fmt(r.practical,3)} m³ <span class="yan">${pratikFark>=0?'+':'−'}%${fmt(Math.abs(pratikFark),1)}</span>`);
  h+=`</dl>`;
  if(Math.abs(pratikFark)>1.5) h+=`<p class="bilgi">Bar g × litre ÷ 1000 pratiği bu dolumda tüpteki gerçek miktardan %${fmt(Math.abs(pratikFark),1)} ${pratikFark>0?'fazla':'az'} hesaplıyor. Fark gerçek gaz davranışından, sıcaklıktan ve gösterge/mutlak basınç ayrımından gelir.</p>`;
  if(o.parca){
    h+=`<h2>Bileşenler</h2>`+Gorsel.bilesim(r.parts,RENKLER,ADLAR)+`<div class="tablo-kap"><table><thead><tr><th>Gaz</th><th>Mol %</th><th>Kütle %</th><th>kg</th><th>m³</th></tr></thead><tbody>`;
    for(const p of r.parts) h+=`<tr><td>${nokta(p.key)}${GAZ[p.key].ad}</td><td>${fmt(p.x*100,3)}</td><td>${fmt(p.w*100,3)}</td><td>${fmt(p.kg,3)}</td><td>${fmt(p.m3,3)}</td></tr>`;
    h+=`</tbody><tfoot><tr><td>Toplam</td><td>100</td><td>100</td><td>${fmt(r.kg,3)}</td><td>${fmt(r.m3,3)}</td></tr></tfoot></table></div>`;
  }
  if(r.plan){
    h+=`<h2>Dolum sırası</h2><div class="tablo-kap"><table><thead><tr><th>Adım</th><th>Eklenecek</th><th>Tartımda toplam</th><th>${fmt(o.T,1)} °C'de manometre</th></tr></thead><tbody>`;
    r.plan.forEach((s,i)=>{
      const pg=barG(s.p);
      let pm = S.olcum==='g' && pg<0.5 ? `${fmt(s.p/1e5*1000,0)} mbar a` : `${fmt(pg,s.p<20e5?2:1)} ${birimP()}`;
      const ek=s.addKg<1?`${fmt(s.addKg*1000,1)} g`:`${fmt(s.addKg,3)} kg`;
      h+=`<tr><td>${i+1}. ${nokta(s.key)}${GAZ[s.key].ad}</td><td>${ek}</td><td>${fmt(s.cumKg,3)} kg</td><td>${s.liquid?`<span class="yan">tartımla ekleyin</span> `:''}${pm}${s.phase?` <span class="yan">${s.phase}</span>`:''}</td></tr>`;
    });
    h+=`</tbody></table></div><p class="bilgi">Tartımda toplam, tüp darası${o.kalan?' ve kalan gaz':''} üzerine eklenecek gaz kütlesidir. Ara basınçlar gazların tamamen karıştığı kabulüyle hesaplanır; dolum anında tabakalaşma nedeniyle manometre birkaç bar farklı gösterebilir. Sıvı beslenen ve düşük oranlı bileşenleri tartımla eklemek daha doğrudur.</p>`;
  }
  h+=(bosP?`<p class="bilgi">Listeye eklemek ve faturalamak için manometrede okunan basıncı girin.</p>`:kaydetAlani())+yontem();
  $('#sonuc').innerHTML=h;
  return r;
}

// Sıvılaştırılmış ve çözünmüş gazlar
function hesaplaSivi(){
  const t=S.tek, g=t.gaz, R=ref();
  const V=num(t.V), dara=num(t.dara), once=num(t.once), sonra=num(t.sonra), T=num(t.sT), oran=num(t.oran[g]);
  const Pok=num(t.lP), tol=num(t.ltol[g]), tT=num(t.tT), tTK=isNaN(tT)?null:tT+273.15;
  if(g!=='C2H2' && !(V>0)) return hata('Tüp su hacmini girin.');
  const tartimVar=dara>=0 && sonra>0;
  let h='', r=null;
  if(tartimVar){
    if(g!=='C2H2' && !(oran>0)) return hata('İzin verilen doluluk oranını girin.');
    r=C.liquefied({key:g,V_L:V,tare:dara,before:isNaN(once)?null:once,after:sonra,T:(isNaN(T)?15:T)+273.15,ref:R,maxRatio:oran,testP_bar:t.test[g],tahminT:tTK});
    if(r.error) return hata(r.error);
    h+=gosterge(!isNaN(once)?'Dolan':'Tüpteki',r.m3,r.netKg,`1 kg = ${fmt(1/r.refDensity,4)} m³`,`1 m³ = ${fmt(r.refDensity,4)} kg`)+uyarilar(r.warn);
  }else{
    h+=`<div class="bos">Darayı ve dolum sonrası tartımı girdiğinizde ${GAZ[g].ad.toLocaleLowerCase('tr-TR')} miktarı burada görünür.</div>`;
  }
  if(g==='C2H2'){
    if(r) h+=`<dl class="ayrinti">`+(!isNaN(once)?satirD('Tüpteki toplam içerik',`${fmt(r.contentKg,3)} kg, ${fmt(r.m3Content,3)} m³`):'')+`</dl>`;
    h+=(r?kaydetAlani():'')+yontem();
    $('#sonuc').innerHTML=h;
    sonHesap=r?{gaz:GAZ[g].ad,yontem:'Tartım',V:'',P:'',T:'',m3:r.m3,kg:r.netKg,comps:[{key:g,x:1}],parts:[{key:g,x:1,kg:r.netKg,m3:r.m3}]}:null;
    return;
  }
  // Manometre kontrolü
  if(!isNaN(T)){
    const TK=T+273.15, tolPa=(tol>=0?tol:0)*1e5;
    const icerik=r?r.contentKg:null;
    const k=C.checkLiquefied({key:g,T:TK,P_read:isNaN(Pok)?null:absPa(Pok),contentKg:icerik,V_L:V,tolPa});
    const T1=fmt(T,1), Tc=G.COMP[g].Tc;
    if(k.status==='bilinmiyor'){
      h+=kontrolBlok({durum:'bilinmiyor',baslik:'Tahmin için tartım gerekli',metin:`${T1} °C, ${GAZ[g].ad.toLocaleLowerCase('tr-TR')} için kritik sıcaklığın (${fmt(Tc-273.15,1)} °C) üzerinde. Bu sıcaklıkta basınç tüpteki miktara bağlıdır; darayı ve tartımı girin.`,kadran:{okunan:isNaN(Pok)?null:pG(absPa(Pok)),beklenen:null,bant:null}});
    }else{
      const ikiFaz=/sıvı \+ gaz/.test(k.phase);
      const tsat=k.Tsat?`${fmt(k.Tsat-273.15,1)} °C`:null;
      const M={
        beklenen:['Beklenen basınç', icerik!=null?`${T1} °C'de bu dolum için manometre <b>${fP(k.P_exp)}</b> göstermeli (${k.phase}).`:`${T1} °C'de tüpte sıvı varsa manometre buhar basıncını, yani <b>${fP(k.P_exp)}</b> göstermeli. Bu değer tüpteki miktardan bağımsızdır.`],
        normal:['Normal', ikiFaz?'Basınç bu sıcaklıktaki buhar basıncıyla uyumlu: tüpte sıvı var, manometre ile termometre tutarlı.':'Basınç bu dolum miktarı ve sıcaklık için beklenen değerde.'],
        dusuk:['Beklenenden düşük', `${tsat?`Okunan basınç yaklaşık ${tsat}'deki buhar basıncına karşılık geliyor; tüp içi termometreden soğuk olabilir. `:''}Sıvı dolum sırasında ve gaz çekilirken tüp soğuduğu için bu normaldir. Sıcaklık dengelendikten sonra da düşükse tüpte sıvı kalmamış ya da manometre hatalı olabilir.`],
        yuksek:['Beklenenden yüksek', `${tsat?`Okunan basınç yaklaşık ${tsat}'deki buhar basıncına karşılık geliyor. `:''}Tüp termometrenin gösterdiğinden sıcak olabilir. Sıcaklık doğruysa tüpte hava ya da başka bir gaz bulunuyor olabilir.`],
        asiri:['Hidrolik dolum', 'Tüp bu sıcaklıkta tamamen sıvıyla dolu. Sıcaklık arttıkça basınç çok hızlı yükselir; doluluk oranını ve tartımı hemen kontrol edin.']
      }[k.status];
      const Ts=sicakliklar(T,tT);
      const buhar=Ts.map(x=>{ const s=G.saturation(g,x+273.15); return s&&!s.supercritical?pG(s.p):NaN; });
      let ana=buhar, egriler=[], lejant=[];
      if(icerik!=null){ ana=C.stateCurve({[g]:icerik/G.molarMass(g)},V/1000,Ts.map(x=>x+273.15)).map(pG); egriler=[{v:buhar,tur:'soluk'},{v:ana,tur:'ana'}]; lejant=[['ana','Bu dolum'],['soluk','Buhar basıncı'],['bant','Kabul aralığı']]; }
      else { egriler=[{v:buhar,tur:'ana'}]; lejant=[['ana','Buhar basıncı'],['bant','Kabul aralığı']]; }
      const okunan=isNaN(Pok)?null:pG(absPa(Pok));
      const grafik={Ts,egriler,bant:{alt:ana.map(v=>v-tolPa/1e5),ust:ana.map(v=>v+tolPa/1e5)},nokta:{T,P:okunan??pG(k.P_exp),durum:k.status,bos:okunan==null},dikey:Tc-273.15<=Ts[Ts.length-1]?[{T:+(Tc-273.15).toFixed(1),ad:'kritik'}]:[],yMax:Math.max(1.4*t.test[g],1.3*(okunan||0),1.3*pG(k.P_exp))};
      const satir=[[`${T1} °C'de beklenen`,`${fP(k.P_exp)}`],['Kabul aralığı',`${fP(k.band[0])} ile ${fP(k.band[1])}`]];
      if(tsat && okunan!=null) satir.push(['Okunan basınca karşılık gelen sıcaklık',tsat]);
      if(tTK){
        let pt=null, faz='';
        if(icerik!=null){ const x=G.liquefiedPressure(g,icerik,V/1000,tTK); pt=x.p; faz=x.phase; }
        else { const sx=G.saturation(g,tTK); if(sx&&!sx.supercritical){ pt=sx.p; faz='buhar basıncı'; } }
        satir.push([`${fmt(tT,1)} °C'de olacak basınç`, pt!=null?`${fP(pt)} <span class="yan">${faz}</span>`:'<span class="yan">tartım gerekli</span>']);
        if(pt!=null) grafik.ekNoktalar=[{T:tT,P:pG(pt),ad:`${fmt(tT,1)} °C`}];
      }
      h+=kontrolBlok({durum:k.status,baslik:M[0],metin:M[1],satirlar:satir,kadran:{okunan,beklenen:pG(k.P_exp),bant:k.band.map(pG),kirmizi:null},grafik,lejant});
    }
  }
  if(r){
    const doluluk=r.ratio/oran;
    const sv=r.pNow.phase==='sıvı + gaz'?r.pNow.liquidVolFrac:(/hidrolik/.test(r.pNow.phase)?1:0);
    h+=`<h2>Tüp içi</h2><div class="tup-kap">${Gorsel.tup(GAZ[g].renk,sv,r.pNow.phase)}<div>`;
    h+=`<div class="tup-baslik">${/sıvı \+ gaz/.test(r.pNow.phase)?`Sıvı hacmin %${fmt(sv*100,0)}'ini kaplıyor`:/hidrolik/.test(r.pNow.phase)?'Tüp tamamen sıvı dolu':/süperkritik/.test(r.pNow.phase)?'Kritik sıcaklık üzerinde, tek faz':'Tüpte yalnız gaz var'}<span class="yan"> (${fmt(isNaN(T)?15:T,0)} °C)</span></div>`;
    h+=`<div class="oran" role="img" aria-label="Doluluk oranı yüzde ${fmt(doluluk*100,0)}"><i class="${doluluk>1?'asim':''}" style="width:${Math.min(doluluk,1)*100}%"></i></div><div class="yan">Doluluk ${fmt(r.ratio,3)} kg/L, izin verilen sınırın %${fmt(doluluk*100,1)}'i</div>`;
    h+=`<dl class="ayrinti tek-sutun">`;
    if(!isNaN(once)) h+=satirD('Tüpteki toplam içerik',`${fmt(r.contentKg,3)} kg, ${fmt(r.m3Content,3)} m³`);
    h+=satirD('En fazla doldurulabilecek',`${fmt(r.maxKg,2)} kg`);
    h+=satirD('Tüp test basıncı',`${t.test[g]} bar`);
    h+=`</dl></div></div>`;
    h+=`<p class="bilgi">${GAZ[g].ad} sıvı fazla dolduğu için tüp basıncı içerdiği miktarı göstermez; yalnızca sıcaklığa bağlı buhar basıncını gösterir. Miktar ve faturalama tartıma dayanmalıdır.</p>`;
    h+=kaydetAlani();
  }
  h+=yontem();
  $('#sonuc').innerHTML=h;
  sonHesap=r?{gaz:GAZ[g].ad,yontem:'Tartım',V,P:isNaN(Pok)?'':`${fmt(Pok,1)} ${birimP()}`,T,m3:r.m3,kg:r.netKg,comps:[{key:g,x:1}],parts:[{key:g,x:1,kg:r.netKg,m3:r.m3}]}:null;
}

function hesaplaKar(){
  const k=S.kar, R=ref();
  if(k.mod==='basinc'){
    const keys=k.satir.map(r=>r.k);
    if(new Set(keys).size!==keys.length) return hata('Aynı gaz birden fazla satırda seçilmiş. Satırları birleştirin.');
    const vals=k.satir.map(r=>num(r.v));
    if(vals.some(v=>isNaN(v)||v<0)) return hata('Her bileşen için oranı girin.');
    const top=vals.reduce((a,b)=>a+b,0);
    if(Math.abs(top-100)>1e-6) return hata(`Oranların toplamı %${fmt(top,3)}. Toplam 100 olmalı.`);
    const comps=k.satir.map((r,i)=>({key:r.k,x:vals[i]/100})).filter(c=>c.x>0);
    const V=num(k.V), Pr=num(k.P), T=num(k.T), hedef=num(k.hedef), tol=num(k.tol), hT=num(k.hT), tT=num(k.tT);
    if(!(V>0)||isNaN(T)) return hata('Tüp su hacmi ve sıcaklığı girin.');
    if(isNaN(Pr)&&isNaN(hedef)) return hata('Okunan basıncı ya da hedef basıncı girin.');
    let kalan=null;
    if(k.kalan){ const kp=num(k.kP), kt=num(k.kT); if(isNaN(kp)||isNaN(kt)) return hata('Kalan gaz basıncı ve sıcaklığını girin.'); kalan={P_abs:absPa(kp),T:kt+273.15}; if(!(kalan.P_abs>0)) kalan=null; }
    const r=basincliHesap({comps,V,Pr,T,hedef,hT,tT,tol,kalan,parca:true});
    if(!r) return;
    sonHesap=isNaN(Pr)?null:{gaz:karisimAdi(comps),yontem:'Basınç',V,P:`${fmt(Pr,1)} ${birimP()}`,T,m3:r.m3,kg:r.kg,bilesen:bilesenMetni(r.parts),Pdeger:Pr,comps:comps.map(c=>({key:c.key,x:c.x})),parts:parcaOzet(r.parts),kalan};
  }else if(k.mod==='siparis'){
    hesaplaSiparis();
  }else{
    const keys=k.ksatir.map(r=>r.k);
    if(new Set(keys).size!==keys.length) return hata('Aynı gaz birden fazla satırda seçilmiş. Satırları birleştirin.');
    const items=k.ksatir.map(r=>({key:r.k,kg:num(r.v)})).filter(i=>i.kg>0);
    const V=num(k.kV), T=num(k.kTT), Pok=num(k.kPok), tol=num(k.ktol), tT=num(k.ktT), tTK=isNaN(tT)?null:tT+273.15;
    if(!items.length){ $('#sonuc').innerHTML=`<div class="bos">Bileşenlerin terazideki kütle artışlarını girdiğinizde karışım oranı, m³ ve beklenen basınç burada görünür.</div>`+yontem(); sonHesap=null; return; }
    if(!(V>0)||isNaN(T)) return hata('Tüp su hacmi ve sıcaklığı girin.');
    const TK=T+273.15;
    const r=C.mixtureByWeight({items,V_L:V,T:TK,ref:R,tahminT:tTK});
    if(r.error) return hata(r.error);
    let h=gosterge('Dolan',r.m3,r.kg,`1 m³ = ${fmt(r.kg/r.m3,4)} kg`,`Tüp içinde ${fmt(r.rho_kgm3,1)} kg/m³`)+uyarilar(r.warn);
    // kontrol
    const tolPa=(tol>=0?tol:0)*1e5, oku=isNaN(Pok)?null:absPa(Pok);
    let durum='beklenen'; if(oku!=null){ const d=oku-r.p; durum=Math.abs(d)<=tolPa?'normal':(d<0?'dusuk':'yuksek'); }
    const fark=oku!=null?fBar(oku-r.p):'';
    const T1=fmt(T,1);
    const M={
      beklenen:['Beklenen basınç',`Tartıma göre ${T1} °C'de manometre <b>${fP(r.p)}</b> göstermeli.`],
      normal:['Normal','Okunan basınç tartımla tutarlı: tüp su hacmi, tartım ve karışım oranı uyumlu görünüyor.'],
      dusuk:['Beklenenden düşük',`Okunan basınç tartıma göre ${fark} bar düşük. Tartım fazla okunmuş, tüp su hacmi damgalı değerden büyük ya da tüpte kaçak olabilir. Sıvı beslenen bileşen henüz tam buharlaşmadıysa da basınç düşük görünür.`],
      yuksek:['Beklenenden yüksek',`Okunan basınç tartıma göre ${fark} bar yüksek. Gaz henüz sıcak olabilir; dengelendikten sonra da yüksekse bir bileşen eksik tartılmış ya da tüpte önceden gaz kalmış olabilir.`]
    }[durum];
    const moller=Object.fromEntries(items.map(i=>[i.key,i.kg/G.molarMass(i.key)]));
    const Ts=sicakliklar(T,tT);
    const egri=C.stateCurve(moller,V/1000,Ts.map(x=>x+273.15)).map(pG);
    const grafik={Ts,egriler:[{v:egri,tur:'ana'}],bant:{alt:egri.map(v=>v-tolPa/1e5),ust:egri.map(v=>v+tolPa/1e5)},nokta:{T,P:oku!=null?pG(oku):pG(r.p),durum,bos:oku==null},dikey:[],sifirdan:false};
    if(tTK&&r.Ptahmin!=null) grafik.ekNoktalar=[{T:tT,P:pG(r.Ptahmin),ad:`${fmt(tT,1)} °C`}];
    const satir=[[`${T1} °C'de beklenen`,fP(r.p)],['Kabul aralığı',`${fP(r.p-tolPa)} ile ${fP(r.p+tolPa)}`]];
    if(tTK&&r.Ptahmin!=null) satir.push([`${fmt(tT,1)} °C'de olacak basınç`,`${fP(r.Ptahmin)}${r.tahminPhase?` <span class="yan">${r.tahminPhase}</span>`:''}`]);
    if(r.Z) satir.push(['Sıkıştırılabilirlik faktörü Z',fmt(r.Z,4)]);
    if(r.ayrisma) satir.push(['Tek faz sınırı (tüp boşalırken)',ayrismaMetni(r.ayrisma)]);
    h+=kontrolBlok({durum,baslik:M[0],metin:M[1],satirlar:satir,kadran:{okunan:oku!=null?pG(oku):null,beklenen:pG(r.p),bant:[pG(r.p-tolPa),pG(r.p+tolPa)],kirmizi:null},grafik,lejant:[['ana','Tartıma göre beklenen'],['bant','Kabul aralığı']]});
    h+=`<h2>Karışım oranı</h2>`+Gorsel.bilesim(r.parts,RENKLER,ADLAR)+`<div class="tablo-kap"><table><thead><tr><th>Gaz</th><th>Mol %</th><th>Kütle %</th><th>kg</th><th>m³</th></tr></thead><tbody>`;
    for(const p of r.parts) h+=`<tr><td>${nokta(p.key)}${GAZ[p.key].ad}</td><td>${fmt(p.x*100,3)}</td><td>${fmt(p.w*100,3)}</td><td>${fmt(p.kg,3)}</td><td>${fmt(p.m3,3)}</td></tr>`;
    h+=`</tbody><tfoot><tr><td>Toplam</td><td>100</td><td>100</td><td>${fmt(r.kg,3)}</td><td>${fmt(r.m3,3)}</td></tr></tfoot></table></div>`;
    h+=`<p class="bilgi">Kütle ve m³ doğrudan tartıma dayanır; basınç yalnızca kontrol içindir.</p>`;
    h+=kaydetAlani()+yontem();
    $('#sonuc').innerHTML=h;
    sonHesap={gaz:karisimAdi(items.map((i,n)=>({key:i.key,x:r.parts[n].x}))),yontem:'Tartım',V,P:oku!=null?`${fmt(Pok,1)} ${birimP()}`:'',T,m3:r.m3,kg:r.kg,bilesen:bilesenMetni(r.parts),comps:r.parts.map(p=>({key:p.key,x:p.x})),parts:parcaOzet(r.parts)};
  }
}
function parcaOzet(parts){ return parts.map(p=>({key:p.key,x:p.x,kg:p.kg,m3:p.m3})); }
function bilesenMetni(parts){ return parts.map(p=>`${GAZ[p.key].f} ${fmt(p.kg,3)} kg / ${fmt(p.m3,3)} m³`).join('; '); }
function hesaplaSiparis(){
  const k=S.kar, R=ref();
  const V=num(k.sV), P=num(k.sP), hT=num(k.sHT), dT=num(k.sDT), cz=num(k.sR);
  if(!(V>0)||isNaN(P)||isNaN(hT)||isNaN(dT)) return hata('Tüp su hacmi, hedef basınç ve sıcaklıkları girin.');
  const items=k.ssatir.map(r=>({key:r.k,miktar:num(r.v),birim:r.u,denge:r.d}));
  const r=C.tasarim({items,V_L:V,P_abs:absPa(P),hedefT:hT+273.15,dolumT:dT+273.15,ref:R,cozunurluk_g:cz>0?cz:null});
  if(r.error) return hata(r.error);
  if(r.eksik){ $('#sonuc').innerHTML=`<div class="bos">Denge dışındaki her bileşen için miktar girdiğinizde dolum planı burada görünür.</div>`+yontem(); sonHesap=null; return; }
  const kgYaz=v=>v<1?`${fmt(v*1000,v<0.01?3:1)} g`:`${fmt(v,3)} kg`;
  let h=gosterge('Hazırlanacak',r.m3,r.kg,`${fmt(r.N/1000,4)} kmol`,`${fmt(hT,1)} °C'de ${fP(r.pHedef)}`)+uyarilar(r.warn);
  h+=`<h2>Bileşim</h2>`+Gorsel.bilesim(r.parts.map(p=>({key:p.key,x:p.x})),RENKLER,ADLAR);
  h+=`<div class="tablo-kap"><table><thead><tr><th class="sol">Gaz</th><th>mol</th><th>Mol %</th><th>ppm mol</th><th>Kütle</th><th>m³</th></tr></thead><tbody>`;
  for(const p of r.parts) h+=`<tr><td class="sol">${nokta(p.key)}${GAZ[p.key].ad}${p.denge?' <span class="yan">denge</span>':''}</td><td>${fmt(p.n,p.n<1?4:2)}</td><td>${fmt(p.x*100,p.x<0.01?5:3)}</td><td>${p.x<0.01?fmt(p.x*1e6,1):''}</td><td>${kgYaz(p.kg)}</td><td>${fmt(p.m3,3)}</td></tr>`;
  h+=`</tbody><tfoot><tr><td class="sol">Toplam</td><td>${fmt(r.N,2)}</td><td>100</td><td></td><td>${kgYaz(r.kg)}</td><td>${fmt(r.m3,3)}</td></tr></tfoot></table></div>`;
  // dolum sırası
  h+=`<h2>Dolum sırası</h2><div class="tablo-kap"><table><thead><tr><th class="sol">Adım</th><th>Eklenecek</th><th>Tartımda toplam</th><th>${fmt(dT,1)} °C'de manometre</th><th>Tartım belirsizliği</th></tr></thead><tbody>`;
  const ara=r.araKarisim&&!r.araKarisim.yetersiz?r.araKarisim:null;
  r.plan.forEach((s,i)=>{
    const pg=barG(s.p);
    const pm=S.olcum==='g'&&pg<0.5?`${fmt(s.p/1e5*1000,0)} mbar a`:`${fmt(pg,s.p<20e5?2:1)} ${birimP()}`;
    const araIle=ara&&ara.kucukler.includes(s.key);
    h+=`<tr><td class="sol">${i+1}. ${nokta(s.key)}${GAZ[s.key].ad}${araIle?' <span class="yan">ara karışımla</span>':''}</td><td>${kgYaz(s.addKg)}</td><td>${kgYaz(s.cumKg)}</td><td>${s.liquid?'<span class="yan">tartımla</span> ':''}${pm}${s.phase?` <span class="yan">${s.phase}</span>`:''}</td><td class="${s.hata!=null&&s.hata>2?'uyari-hucre':''}">${s.hata!=null?'%'+fmt(s.hata,s.hata<0.1?3:1):''}</td></tr>`;
  });
  h+=`</tbody></table></div><p class="bilgi">Kütleler tüp darası üzerine eklenecek miktarlardır ve siparişin esasıdır; ara basınçlar gazların tamamen karıştığı kabulüyle kontrol amaçlı verilir. ${Math.abs(dT-hT)>1e-9?`Son basınç ${fmt(dT,1)} °C'de ${fP(r.pDolum)}, ${fmt(hT,1)} °C'de ${fP(r.pHedef)} olur.`:`Son basınç ${fmt(hT,1)} °C'de ${fP(r.pHedef)} olur.`} Dolumdan sonra tüpü yuvarlayarak ya da bekleterek homojenleştirin ve GC ile doğrulayın.${r.ayrisma?` Karışım, tüp boşalırken ${fmt(r.ayrisma.T-273.15,0)} °C'nin üstünde tutulduğu sürece tek faz kalır.`:''}</p>`;
  if(ara){
    const dg=GAZ[ara.dengeKey].ad;
    h+=`<h2>Ara karışım önerisi</h2><div class="ara-karisim">
      <p>Küçük bileşenleri doğrudan tartmak yerine önce ${ara.D} kat derişik bir ara karışım hazırlayın, sonra bu ara karışımdan ekleyin.</p>
      <div class="ara-grid"><div><div class="grup-baslik">1. Ara karışım tüpü (aynı tüp tipi, ${fP(absPa(P))})</div><table><tbody>${ara.bilesim.map((c,i)=>`<tr><td class="sol">${nokta(c.key)}${GAZ[c.key].ad}</td><td>${c.x<0.01?fmt(c.x*1e6,0)+' ppm':'%'+fmt(c.x*100,3)}</td><td>${kgYaz(ara.hazirlik[i].kg)}</td></tr>`).join('')}</tbody><tfoot><tr><td class="sol">Toplam</td><td></td><td>${kgYaz(ara.hazirlikKg)}</td></tr></tfoot></table></div>
      <div><div class="grup-baslik">2. Sipariş tüpüne</div><table><tbody>${r.plan.filter(s=>!ara.kucukler.includes(s.key)&&s.key!==ara.dengeKey).map(s=>`<tr><td class="sol">${nokta(s.key)}${GAZ[s.key].ad}</td><td>${kgYaz(s.addKg)}</td></tr>`).join('')}<tr><td class="sol">Ara karışım</td><td>${kgYaz(ara.eklenecekKg)}</td></tr><tr><td class="sol">${nokta(ara.dengeKey)}${dg}, kalan</td><td>${kgYaz(ara.dengeDogrudanKg)}</td></tr></tbody></table></div></div>
      <p class="yan">Ara karışımdan eklenen ${kgYaz(ara.eklenecekKg)} için tartım belirsizliği yaklaşık %${fmt(num(k.sR)/1000/ara.eklenecekKg*100,2)}. Ara karışımın gerçek bileşimini GC ile doğrulayıp sipariş hesabını ölçülen değere göre düzeltmek en doğru sonucu verir.</p></div>`;
  }
  h+=`<div class="kaydet-alt siparis-gc"><button class="dugme ikincil" id="siparis-gc">GC analizine nominal değer olarak aktar</button></div>`;
  h+=kaydetAlani()+yontem();
  $('#sonuc').innerHTML=h;
  S.kar.sonTasarim=r;
  sonHesap={gaz:karisimAdi(r.comps),yontem:'Sipariş',V,P:`${fmt(P,1)} ${birimP()} (hedef)`,T:hT,m3:r.m3,kg:r.kg,bilesen:bilesenMetni(r.parts),comps:r.comps.map(c=>({key:c.key,x:c.x})),parts:parcaOzet(r.parts)};
}
function karisimAdi(comps){
  const s=[...comps].sort((a,b)=>b.x-a.x);
  return s.map((c,i)=>i===0?GAZ[c.key].f:`%${fmt(c.x*100,c.x<0.01?3:1)} ${GAZ[c.key].f}`).join(' + ');
}

// ---------- Kalıcı depolama ----------
const Depo={
  tur:'gecici',
  hazirla(){
    if(window.storage && typeof window.storage.get==='function'){ this.tur='claude'; return; }
    try{ const k='__gaz_dolum_test'; window.localStorage.setItem(k,'1'); window.localStorage.removeItem(k); this.tur='yerel'; }catch(e){ this.tur='gecici'; }
  },
  async oku(anahtar){
    try{
      if(this.tur==='claude'){ const r=await window.storage.get(anahtar,false); return r&&r.value?JSON.parse(r.value):null; }
      if(this.tur==='yerel'){ const v=window.localStorage.getItem(anahtar); return v?JSON.parse(v):null; }
    }catch(e){}
    return null;
  },
  async yaz(anahtar,deger){
    try{
      const v=JSON.stringify(deger);
      if(this.tur==='claude'){ await window.storage.set(anahtar,v,false); return true; }

const zamanDamgasi=x=>x.guncel||x.ts||0;
function birlestir(dosya){
  if(!dosya) return;
  const sil={...S.silinenler}; for(const [k,v] of Object.entries(dosya.silinenler||{})) sil[k]=Math.max(sil[k]||0,v);
  const topla=(a,b)=>{ const m=new Map(); for(const x of [...(b||[]),...(a||[])]){ if(!x||!x.id) continue; const o=m.get(x.id); if(!o||zamanDamgasi(x)>zamanDamgasi(o)) m.set(x.id,x); } return [...m.values()].filter(x=>!(sil[x.id]&&sil[x.id]>=zamanDamgasi(x))); };

const tupAnahtari=v=>String(v||'').trim().toLocaleUpperCase('tr-TR').replace(/\s+/g,'');

function dolumIndeksi(){ const m=new Map(); for(const r of S.kayit){ const k=tupAnahtari(r.tupNo); if(!k) continue; if(!m.has(k)) m.set(k,[]); m.get(k).push(r); } return m; }
const ESNEKLIK=6*3600e3; // analiz tarihi dolum kaydından en fazla 6 saat önce görünebilir (saat girişi farkları)
function kayitAnalizi(r,aIdx,dIdx){
  const k=tupAnahtari(r.tupNo); if(!k) return null;
  const adaylar=aIdx.get(k); if(!adaylar) return null;
  const t=olcumZamani(r);
  const sonraki=(dIdx.get(k)||[]).filter(x=>x.id!==r.id).map(olcumZamani).filter(z=>z>t).sort((a,b)=>a-b)[0]??Infinity;
  const l=adaylar.filter(a=>olcumZamani(a)>=t-ESNEKLIK && olcumZamani(a)<sonraki).sort((a,b)=>olcumZamani(b)-olcumZamani(a));
  return l.length?{analiz:l[0],adet:l.length}:null;
}
function analizinDolumu(a,seri,dIdx){
  const l=(dIdx.get(tupAnahtari(seri))||[]).filter(r=>olcumZamani(r)<=olcumZamani(a)+ESNEKLIK).sort((x,y)=>olcumZamani(y)-olcumZamani(x));
  return l[0]||null;
}
function sonDolumKaydi(seri){ const k=tupAnahtari(seri); if(!k) return null; return S.kayit.filter(r=>tupAnahtari(r.tupNo)===k).sort((a,b)=>olcumZamani(b)-olcumZamani(a))[0]||null; }
function kayitBasinci(r){
  let v=r.Pdeger, u=r.olcum; const patm=r.patm||S.patm;
  if(v==null||v===''||isNaN(v)){ const m=/(-?[\d.,]+)\s*bar\s*([ga])/.exec(r.P||''); if(!m) return null; v=trSayi(m[1]); u=m[2]; }
  if(!isFinite(v)) return null;
  return (u==='a'?v:v+patm)*1e5;
}
function kayitBilesimi(r){
  if(r.comps&&r.comps.length) return {comps:r.comps,parts:r.parts||null};
  if(r.bilesen){
    const parts=[];
    for(const seg of r.bilesen.split(';')){ const m=/^\s*(.+?)\s+([\d.,]+)\s*kg\s*\/\s*([\d.,]+)\s*m³\s*$/.exec(seg); if(!m) continue; const key=Object.keys(GAZ).find(k=>GAZ[k].f===m[1].trim()); if(key) parts.push({key,kg:trSayi(m[2]),m3:trSayi(m[3])}); }
    if(parts.length){ const n=parts.map(p=>p.kg/G.molarMass(p.key)); const N=n.reduce((a,b)=>a+b,0); parts.forEach((p,i)=>{ p.x=n[i]/N; }); return {comps:parts.map(p=>({key:p.key,x:p.x})),parts}; }
  }
  const key=Object.keys(GAZ).find(k=>GAZ[k].ad===r.gaz);
  if(key&&key!=='SAIR') return {comps:[{key,x:1}],parts:[{key,x:1,kg:r.kg,m3:r.m3}]};
  return {comps:null,parts:null};
}
function kayitReferansi(r){ const k=r.refKey&&REF[r.refKey]?r.refKey:(Object.keys(REF).find(x=>REF[x].ad===r.ref)||S.ref); return REF[k]; }
function analizeGoreIcerik(r,a){
  const x=a.sonuc.filter(q=>q.sonuc>0).map(q=>({key:q.key,x:q.sonuc/100}));
  const ref=kayitReferansi(r);
  let parts=null, temel='';
  if(r.yontem==='Basınç' && r.V>0 && isFinite(r.T) && !x.some(c=>c.key==='C2H2')){
    const Pa=kayitBasinci(r);
    if(Pa>0){ try{ const q=C.byPressure({comps:x,V_L:r.V,P_abs:Pa,Pg_bar:Pa/1e5-(r.patm||S.patm),T:r.T+273.15,ref,residual:r.kalan||null,target15_abs:null,ayrisma:false}); if(!q.error){ parts=q.parts.map(p=>({key:p.key,x:p.x,kg:p.kg,m3:p.m3})); temel='basinc'; } }catch(_){} }
  }
  if(!parts && r.kg>0){
    const Mmix=x.reduce((t,c)=>t+c.x*G.molarMass(c.key),0), n=r.kg/Mmix;
    parts=x.map(c=>({key:c.key,x:c.x,kg:n*c.x*G.molarMass(c.key),m3:n*c.x*C.vref(c.key,ref)})); temel='kutle';
  }
  return {parts,temel,ref};
}

  let tPkg=0,tAkg=0,tAm3=0,tPm3=0;

  notlar.push(`m³ değerleri ${ic.ref.ad} referans şartındadır.`);
  if(link.adet>1) notlar.push(`Bu dolumdan sonra ${link.adet} analiz yapılmış; en son yapılan gösteriliyor.`);
  if(olcumZamani(a)<olcumZamani(r)) notlar.push('Analiz tarihi dolum kaydından biraz önce görünüyor; tarihleri kontrol edin.');
  h+=`<p class="yan">${notlar.join(' ')}</p></div>`;
  return h;
}

// Alan değerleri için esnek sayı okuma: 1.250.000 / 1,250,000 / 1250000,5 / 1250000.5
function numAlan(v){
  if(v==null) return NaN; let s=String(v).trim().replace(/\s/g,''); if(s==='') return NaN;
  const nokta=(s.match(/\./g)||[]).length, virgul=(s.match(/,/g)||[]).length;
  if(nokta&&virgul){ const son=Math.max(s.lastIndexOf('.'),s.lastIndexOf(',')); const ond=s[son]; s=s.replace(ond==='.'?/,/g:/\./g,''); if(ond===',') s=s.replace(',','.'); }
  else if(virgul>1) s=s.replace(/,/g,'');
  else if(virgul===1) s=s.replace(',','.');
  else if(nokta>=1){ const g=s.replace(/^[-+]/,'').split('.'); const binlik=g[0]!=='0' && g[0].length<=3 && g.slice(1).every(x=>/^\d{3}$/.test(x)); if(binlik||nokta>1) s=s.replace(/\./g,''); }
  return Number(s);
}

function kayittanTupSatiri(r){
  const Pa=kayitBasinci(r);
  const P=Pa?String(+((S.olcum==='g'?Pa/1e5-S.patm:Pa/1e5)).toFixed(1)).replace('.',','):'';
  return {seri:r.tupNo,V:r.V===''||r.V==null?'':String(r.V).replace('.',','),P,T:r.T===''||r.T==null||isNaN(r.T)?'':String(r.T).replace('.',','),oto:false};
}
function cizGcKayitListe(){
  const el=$('#gc-kayit-liste'); if(!el) return;
  const f=S.gc.form, q=(f.kayitAra||'').trim().toLocaleLowerCase('tr-TR');
  const mevcut=new Set(f.tupler.map(t=>tupAnahtari(t.seri)).filter(Boolean));
  const l=S.kayit.filter(r=>r.tupNo && !mevcut.has(tupAnahtari(r.tupNo)) && (!q||[r.tupNo,r.musteri,r.gaz].join(' ').toLocaleLowerCase('tr-TR').includes(q))).sort((a,b)=>olcumZamani(b)-olcumZamani(a)).slice(0,60);
  if(!l.length){ el.innerHTML=`<p class="yan">${S.kayit.some(r=>r.tupNo)?'Uygun dolum kaydı yok; partide olmayan ve tüp numarası girilmiş kayıtlar listelenir.':'Tüp numarası girilmiş dolum kaydı yok.'}</p>`; return; }
  el.innerHTML=`<div class="tablo-kap"><table class="gc-kayit-tablo"><thead><tr><th></th><th class="sol">Ölçüm tarihi</th><th class="sol">Tüp no</th><th class="sol">Müşteri</th><th class="sol">Gaz</th><th>Su hacmi L</th><th>Basınç</th><th>Sıcaklık °C</th></tr></thead><tbody>${l.map(r=>`<tr><td><input type="checkbox" data-gckayit="${esc(r.id)}" aria-label="${esc(r.tupNo)} seç"></td><td class="sol">${esc(r.zaman||tarihMetni(r.ts))}</td><td class="sol">${esc(r.tupNo)}</td><td class="sol">${esc(r.musteri||'')}</td><td class="sol">${esc(r.gaz)}</td><td>${r.V===''||r.V==null?'':fmt(r.V,1)}</td><td>${esc(r.P||'')}</td><td>${r.T===''||r.T==null||isNaN(r.T)?'':fmt(r.T,1)}</td></tr>`).join('')}</tbody></table></div>`;
}
function gcGirdileriniOku(){
  const f=S.gc.form;
  const sart=f.sartOn?{rP:num(f.rP)*1e5,rT:num(f.rT)+273.15,sP:num(f.sP)*1e5,sT:num(f.sT)+273.15}:null;
  if(sart && ![sart.rP,sart.rT,sart.sP,sart.sT].every(v=>v>0)) return {hata:'Enjeksiyon basınç ve sıcaklıklarını girin ya da düzeltmeyi kapatın.'};
  return {sart, satirlar:f.satir.map(r=>({key:r.k,refAlan:numAlan(r.refAlan),refDer:num(r.refDer),alanlar:r.alan.map(numAlan),denge:r.denge,nom:num(r.nom),tol:num(r.tol)}))};
}
function gcHesapla(){
  const el=$('#gc-sonuc'); if(!el) return;
  const f=S.gc.form, g=gcGirdileriniOku();
  let a=null;
  if(g.hata){ el.innerHTML=`<p class="hata">${g.hata}</p>`; }
  else{
    a=C.gcAnaliz(g);
    // ortalama ve RSD hücreleri
    f.satir.forEach((r,i)=>{ const o=$('#gc-ort-'+i), s=$('#gc-rsd-'+i); const q=a&&a.satirlar?a.satirlar[i]:null;
      if(o) o.textContent=q&&q.ort!=null?fmt(q.ort,q.ort<100?2:0):''; if(s){ s.textContent=q&&q.rsd!=null?fmt(q.rsd,2):''; s.classList.toggle('uyari-hucre',!!(q&&q.rsd>2)); } });
    if(a.error){ el.innerHTML=`<p class="hata">${a.error}</p>`; a=null; }
    else if(a.eksik){ el.innerHTML=`<div class="bos">${a.referansEksik?`${GAZ[a.referansEksik].ad} için referans alanını girin.`:'Ölçülen her bileşen için en az bir numune alanı girdiğinizde bileşim burada görünür.'}</div>`; a=null; }
    else{
      const parts=a.satirlar.map(r=>({key:r.key,x:Math.max(0,r.sonuc)/100}));
      let h=`<div class="gc-sonuc-ust">${Gorsel.bilesim(parts,RENKLER,ADLAR)}${a.genel!==null?`<div class="gc-karar ${a.genel?'uygun':'degil'}">${a.genel?'Spesifikasyona uygun':'Spesifikasyon dışı'}</div>`:''}</div>`;
      h+=`<div class="tablo-kap"><table><thead><tr><th class="sol">Gaz</th><th>Ham %</th><th>Sonuç %</th><th>Nominal %</th><th>Fark</th><th>Tolerans ±</th><th class="sol">Durum</th></tr></thead><tbody>`;
      for(const r of a.satirlar) h+=`<tr><td class="sol">${nokta(r.key)}${GAZ[r.key].ad}${r.denge?' <span class="yan">denge</span>':''}</td><td>${r.ham!=null?fmt(r.ham,3):'<span class="yan">kalan</span>'}</td><td class="gc-deger">${derisimMetni(r.sonuc)}</td><td>${yuzde(r.nom)}</td><td>${r.fark!=null?(r.fark>=0?'+':'−')+fmt(Math.abs(r.fark),3):''}</td><td>${yuzde(r.tol)}</td><td class="sol">${DURUM_ETIKET(r.uygun)}</td></tr>`;
      h+=`</tbody><tfoot><tr><td class="sol">Toplam</td><td>${a.normalize?fmt(a.toplamHam,3):''}</td><td>100</td><td colspan="4" class="sol yan">${a.normalize?'Sonuçlar 100\'e normalize edildi':'Denge bileşeni 100\'den kalan olarak hesaplandı'}${a.zS!=null?`, enjeksiyon şartı düzeltildi (numune Z ${fmt(a.zS,4)})`:''}</td></tr></tfoot></table></div>`;
      h+=uyarilar(a.warn);
      el.innerHTML=h;
    }
  }
  // parti tüpleri
  const R=ref(); let tm3=0, tkg=0, say=0, hataVar=false;
  const comps=a?a.satirlar.filter(r=>r.sonuc>0).map(r=>({key:r.key,x:r.sonuc/100})):null;
  const asetilen=comps&&comps.some(c=>c.key==='C2H2');
  const tupSonuc=f.tupler.map((t,i)=>{
    const m=$('#gc-tm3-'+i), k=$('#gc-tkg-'+i);
    const V=num(t.V), P=num(t.P), T=num(t.T);
    let out={m3:null,kg:null};
    if(comps&&comps.length&&!asetilen&&V>0&&isFinite(P)&&isFinite(T)){
      const Pa=absPa(P);
      if(Pa>0){ try{ const r=C.byPressure({comps,V_L:V,P_abs:Pa,Pg_bar:barG(Pa)+(S.olcum==='g'?0:-S.patm),T:T+273.15,ref:R,residual:null,target15_abs:null,ayrisma:false}); if(!r.error){ out={m3:r.m3,kg:r.kg}; tm3+=r.m3; tkg+=r.kg; say++; } else hataVar=true; }catch(_){ hataVar=true; } }
    }
    if(m) m.textContent=out.m3!=null?fmt(out.m3,3):''; if(k) k.textContent=out.kg!=null?fmt(out.kg,3):'';
    return out;
  });
  const oz=$('#gc-tup-ozet'); if(oz) oz.innerHTML=`Toplam <span class="yan">${f.tupler.length} tüp${say!==f.tupler.length?`, ${say} tanesi hesaplandı`:''}${asetilen?', asetilen içeren karışımda basınçla miktar hesaplanmaz':''}</span>`;
  const a1=$('#gc-tm3-top'), a2=$('#gc-tkg-top'); if(a1) a1.textContent=say?fmt(tm3,3):''; if(a2) a2.textContent=say?fmt(tkg,3):'';
  S.gc.son={analiz:a,tupSonuc};
}

function gcKaydiOlustur(){
  const f=S.gc.form, a=S.gc.son&&S.gc.son.analiz;
  if(!a) return null;
  const ts=Date.now();
  return {id:f.duzenle||kimlik(), ts, tarih:S.gc.kayitTarihi, zaman:tarihMetni(S.gc.kayitTarihi), musteri:f.musteri.trim(), analizNo:f.analizNo.trim(), seriNo:f.seriNo.trim(), partiNo:f.partiNo.trim(),
    tekrar:f.tekrar, sartOn:f.sartOn, sP:f.sP, sT:f.sT, rP:f.rP, rT:f.rT,
    girdi:f.satir.map(r=>({...r,alan:[...r.alan]})),
    sonuc:a.satirlar, toplamHam:a.toplamHam, normalize:a.normalize, zS:a.zS, genel:a.genel,
    tupler:f.tupler.map((t,i)=>({seri:t.seri.trim(),V:t.V,P:t.P,T:t.T,m3:S.gc.son.tupSonuc[i].m3,kg:S.gc.son.tupSonuc[i].kg})).filter(t=>t.seri||t.P),
    ref:REF[S.ref].ad, birim:birimP()};
}
function bilesimMetni(sonuc){ return [...sonuc].sort((a,b)=>b.sonuc-a.sonuc).map(r=>`${GAZ[r.key].f} %${fmt(r.sonuc,r.sonuc<1?3:2)}`).join(', '); }

function gcFiltreli(){
  const q=S.gc.ara.trim().toLocaleLowerCase('tr-TR');
  return S.analizler.filter(a=>!q||[a.analizNo,a.musteri,a.seriNo,a.partiNo,...a.tupler.map(t=>t.seri),...a.sonuc.map(r=>GAZ[r.key].ad)].join(' ').toLocaleLowerCase('tr-TR').includes(q)).sort((x,y)=>olcumZamani(y)-olcumZamani(x));
}

function gcDetayHtml(a){

  h+=`<dl class="ayrinti gc-bilgi">${satirD('Müşteri',esc(a.musteri)||'—')}${satirD('Analiz tarihi',esc(a.zaman))}${satirD('Numune tüp seri no',esc(a.seriNo)||'—')}${satirD('Parti no',esc(a.partiNo)||'—')}${satirD('Enjeksiyon tekrarı',a.tekrar)}${satirD('Enjeksiyon şartı düzeltmesi',a.sartOn?`referans ${esc(a.rP)} bar a, ${esc(a.rT)} °C; numune ${esc(a.sP)} bar a, ${esc(a.sT)} °C`:'yok')}</dl>`;
  h+=Gorsel.bilesim(a.sonuc.map(r=>({key:r.key,x:Math.max(0,r.sonuc)/100})),RENKLER,ADLAR);
  h+=`<div class="tablo-kap"><table><thead><tr><th class="sol">Gaz</th><th>Referans %</th><th>Referans alanı</th>${hT.map(j=>`<th>Alan ${a.tekrar>1?j+1:''}</th>`).join('')}<th>Ortalama</th><th>RSD %</th><th>Sonuç %</th><th>Nominal %</th><th>Tolerans ±</th><th class="sol">Durum</th></tr></thead><tbody>`;
  a.sonuc.forEach((r,i)=>{ const gi=a.girdi[i]||{alan:[]};
    h+=`<tr><td class="sol">${nokta(r.key)}${GAZ[r.key].ad}${r.denge?' <span class="yan">denge</span>':''}</td><td>${r.denge?'':esc(gi.refDer)}</td><td>${r.denge?'':esc(gi.refAlan)}</td>${hT.map(j=>`<td>${r.denge?'':esc(gi.alan[j]||'')}</td>`).join('')}<td>${r.ort!=null?fmt(r.ort,r.ort<100?2:0):''}</td><td>${r.rsd!=null?fmt(r.rsd,2):''}</td><td class="gc-deger">${derisimMetni(r.sonuc)}</td><td>${yuzde(r.nom)}</td><td>${yuzde(r.tol)}</td><td class="sol">${DURUM_ETIKET(r.uygun)}</td></tr>`; });
  h+=`</tbody></table></div><p class="yan">${a.normalize?`Ham toplam %${fmt(a.toplamHam,3)}, sonuçlar 100'e normalize edildi.`:'Denge bileşeni 100\'den kalan olarak hesaplandı.'}</p>`;
  if(a.tupler.length){

    h+=`<h2>Parti tüpleri</h2><div class="tablo-kap"><table><thead><tr><th class="sol">#</th><th class="sol">Seri no</th><th>Su hacmi L</th><th>Basınç ${esc(a.birim)}</th><th>Sıcaklık °C</th><th>m³</th><th>kg</th><th class="sol">Dolum kaydı</th></tr></thead><tbody>${a.tupler.map((t,i)=>{ const dk=analizinDolumu(a,t.seri,dIdxR); return `<tr><td class="sol yan">${i+1}</td><td class="sol">${esc(t.seri)}</td><td>${esc(t.V)}</td><td>${esc(t.P)}</td><td>${esc(t.T)}</td><td>${t.m3!=null?fmt(t.m3,3):''}</td><td>${t.kg!=null?fmt(t.kg,3):''}</td><td class="sol">${dk?`${esc(dk.zaman||tarihMetni(dk.ts))} <span class="yan">${esc(dk.yontem)}</span>`:'<span class="yan">bulunamadı</span>'}</td></tr>`; }).join('')}</tbody><tfoot><tr><td class="sol" colspan="5">Toplam ${a.tupler.length} tüp</td><td>${fmt(tm3,3)}</td><td>${fmt(tkg,3)}</td><td></td></tr></tfoot></table></div><p class="yan">m³ değerleri ${esc(a.ref)} referans şartındadır. Dolum kaydı sütunu, Kayıtlar sayfasında aynı tüp numarasıyla analizden önce yapılmış son dolumu gösterir.</p>`;
  }
  return h;
}
function cizGcDetay(id,kaydir=true){
  const el=$('#gc-detay'); const a=S.analizler.find(x=>x.id===id); if(!el) return;
  if(!a){ el.innerHTML=''; S.gc.acik=null; return; }
  el.innerHTML=`<section class="gc-detay" aria-label="Analiz ayrıntısı">${gcDetayHtml(a)}<div class="kaydet-alt gc-detay-dugme"><button class="dugme" data-gcyazdir="${a.id}">Yazdır</button><button class="dugme ikincil" data-gcduzenle="${a.id}">Düzenle</button><button class="dugme ikincil" data-gckopya="${a.id}">Bu analizden yeni analiz başlat</button><button class="metin-dugme" id="gc-kapat">Kapat</button></div></section>`;
  if(kaydir) el.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
}
function gcCsv(liste){
  const q=v=>{ const s=String(v??''); return /[;"\n\t]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const sayi=(v,d)=>v==null||!isFinite(v)?'':Number(v).toFixed(d).replace('.',',');
  const gazlar=[...new Set(liste.flatMap(a=>a.sonuc.map(r=>r.key)))];
  const bas=['Analiz tarihi','Analiz no','Müşteri','Numune seri no','Parti no',...gazlar.map(k=>GAZ[k].ad+' %'),'Durum','Tüp seri no','Su hacmi (L)','Basınç','Sıcaklık (°C)','m³','kg','m³ referansı'];
  const satirlar=[];
  for(const a of liste){
    const ortak=[a.zaman,a.analizNo,a.musteri,a.seriNo,a.partiNo,...gazlar.map(k=>{ const r=a.sonuc.find(x=>x.key===k); return r?sayi(r.sonuc,4):''; }),a.genel===true?'Uygun':a.genel===false?'Uygun değil':''];
    if(a.tupler.length) for(const t of a.tupler) satirlar.push([...ortak,t.seri,t.V,t.P?`${t.P} ${a.birim}`:'',t.T,sayi(t.m3,3),sayi(t.kg,3),a.ref]);
    else satirlar.push([...ortak,'','','','','','',a.ref]);
  }
  return [bas.join(';')].concat(satirlar.map(r=>r.map(q).join(';'))).join('\r\n');
}
function gcYazdir(id){
  const a=S.analizler.find(x=>x.id===id); if(!a) return;
  let alan=document.getElementById('yazdir-alani'); if(!alan){ alan=document.createElement('div'); alan.id='yazdir-alani'; document.body.appendChild(alan); }
  alan.innerHTML=`<div class="yazdir-baslik">Gaz dolum hesaplayıcı</div>`+gcDetayHtml(a);
  document.body.classList.add('yazdir-gc');
  const bitir=()=>{ document.body.classList.remove('yazdir-gc'); window.removeEventListener('afterprint',bitir); };
  window.addEventListener('afterprint',bitir);
  try{ window.print(); }catch(_){ bildir('Yazdırma bu ortamda engellendi. Dosyayı bilgisayarınızda tarayıcıda açıp tekrar deneyin.'); bitir(); }
  setTimeout(()=>{ if(!window.matchMedia('print').matches) bitir(); },1500);
}

kok.addEventListener('input',e=>{
  const t=e.target, d=t.dataset; if(S.sekme!=='gc') return;
  const f=S.gc.form;
  if(d.gcf){ f[d.gcf]=t.value; if(['sP','sT','rP','rT'].includes(d.gcf)) gcHesapla(); return; }
  if(d.gcara){ S.gc.ara=t.value; cizGcListe(); return; }
  if(d.gctoplumetin){ f.toplu=t.value; return; }
  if(d.gckayitara){ f.kayitAra=t.value; cizGcKayitListe(); return; }
  if(d.gcsatir!==undefined && t.type!=='checkbox' && t.tagName!=='SELECT'){
    const r=f.satir[+d.gcsatir];
    if(d.gcalan==='alan') r.alan[+d.gcenj]=t.value; else r[d.gcalan]=t.value;
    if(d.gcalan==='refAlan'||d.gcalan==='refDer'){ S.gcRef[r.k]={alan:r.refAlan,der:r.refDer,tarih:Date.now()}; saklaGcRef(); }
    gcHesapla(); return;
  }
  if(d.gctup!==undefined){ f.tupler[+d.gctup][d.gctupalan]=t.value; if(d.gctupalan!=='seri') f.tupler[+d.gctup].oto=false; if(d.gctupalan!=='seri') gcHesapla(); return; }
});
kok.addEventListener('change',e=>{
  const t=e.target, d=t.dataset; if(S.sekme!=='gc') return;
  const f=S.gc.form;
  if(d.gctekrar){ const n=+t.value; f.tekrar=n; f.satir.forEach(r=>{ r.alan=Array.from({length:n},(_,j)=>r.alan[j]||''); }); cizGcSayfasi(); return; }
  if(d.gcsart){ f.sartOn=t.checked; cizGcSayfasi(); return; }
  if(d.gcsatir!==undefined && d.gcalan==='k'){ const r=f.satir[+d.gcsatir]; r.k=t.value; const ref=S.gcRef[r.k]; r.refAlan=ref?ref.alan:''; r.refDer=ref?ref.der:'100'; cizGcSayfasi(); return; }
  if(d.gctup!==undefined && d.gctupalan==='seri'){
    const row=f.tupler[+d.gctup], r=sonDolumKaydi(t.value);
    if(tupAnahtari(t.value) && f.tupler.some((x,j)=>j!==+d.gctup && tupAnahtari(x.seri)===tupAnahtari(t.value))){ bildir(`${t.value.trim()} bu partide zaten var.`); return; }
    if(r && (row.oto || !String(row.P).trim())){ Object.assign(row,kayittanTupSatiri(r),{seri:t.value.trim()}); cizGcSayfasi(); bildir(`${r.tupNo} için su hacmi, basınç ve sıcaklık ${r.zaman||tarihMetni(r.ts)} tarihli dolum kaydından alındı.`); }
    return;
  }
  if(d.gcf==='seriNo'){ const r=sonDolumKaydi(t.value); if(r&&r.musteri&&!f.musteri.trim()){ f.musteri=r.musteri; const m=document.getElementById('gc-musteri'); if(m) m.value=r.musteri; bildir(`Müşteri, ${r.tupNo} dolum kaydından alındı.`); } return; }
  if(d.gcsatir!==undefined && d.gcalan==='denge'){ f.satir.forEach((r,i)=>{ r.denge = i===+d.gcsatir ? t.checked : false; }); cizGcSayfasi(); return; }
});
kok.addEventListener('click',async e=>{
  if(S.sekme!=='gc') return;
  const t=e.target.closest('button'); if(!t) return;
  const d=t.dataset, f=S.gc.form;
  if(d.gcgorunum){ S.gc.gorunum=d.gcgorunum; cizGcSayfasi(); return; }
  if(d.gchazir!==undefined){
    const p=HAZIR[+d.gchazir]; const enBuyuk=p.r.reduce((m,x)=>x[1]>m[1]?x:m,p.r[0])[0];
    f.satir=p.r.map(([k,v])=>gcSatir(k,String(v).replace('.',','),'',k===enBuyuk,f.tekrar)); cizGcSayfasi(); return;
  }
  if(d.gcekle){ const bos=GC_GAZ.find(k=>!f.satir.some(r=>r.k===k)); f.satir.push(gcSatir(bos||'N2','','',false,f.tekrar)); cizGcSayfasi(); return; }
  if(d.gckaldir!==undefined){ f.satir.splice(+d.gckaldir,1); cizGcSayfasi(); return; }
  if(d.gctupekle){ const s=f.tupler[f.tupler.length-1]||{V:'50',P:'',T:'15'}; f.tupler.push({seri:'',V:s.V,P:s.P,T:s.T,oto:true}); cizGcSayfasi(); const son=document.querySelector(`[data-gctup="${f.tupler.length-1}"][data-gctupalan="seri"]`); if(son) son.focus(); return; }
  if(d.gckayitsec){ f.kayitSecAcik=!f.kayitSecAcik; cizGcSayfasi(); if(f.kayitSecAcik) document.getElementById('gc-kayit-ara')?.focus(); return; }
  if(d.gckayitekle){
    const ids=[...document.querySelectorAll('[data-gckayit]:checked')].map(x=>x.dataset.gckayit);
    if(!ids.length) return bildir('Önce eklenecek dolum kayıtlarını işaretleyin.');
    f.tupler=f.tupler.filter(x=>String(x.seri).trim()||String(x.P).trim());
    for(const id of ids){ const r=S.kayit.find(x=>x.id===id); if(r) f.tupler.push(kayittanTupSatiri(r)); }
    if(!f.tupler.length) f.tupler.push({seri:'',V:'50',P:'',T:'15'});
    if(!f.musteri.trim()){ const r=S.kayit.find(x=>x.id===ids[0]); if(r&&r.musteri) f.musteri=r.musteri; }
    f.kayitSecAcik=false; cizGcSayfasi(); bildir(`${ids.length} tüp dolum kayıtlarından partiye eklendi.`); return;
  }
  if(d.gctupkaldir!==undefined){ f.tupler.splice(+d.gctupkaldir,1); cizGcSayfasi(); return; }
  if(d.gcnumunetup){
    if(!f.seriNo.trim()) return bildir('Önce numune tüp seri numarasını girin.');
    if(f.tupler.some(x=>x.seri.trim()===f.seriNo.trim())) return bildir('Numune tüpü listede zaten var.');
    const bosSatir=f.tupler.find(x=>!x.seri.trim());
    if(bosSatir) bosSatir.seri=f.seriNo.trim(); else { const s=f.tupler[f.tupler.length-1]; f.tupler.push({seri:f.seriNo.trim(),V:s.V,P:s.P,T:s.T}); }
    cizGcSayfasi(); return;
  }
  if(d.gctoplu){ f.topluAcik=!f.topluAcik; cizGcSayfasi(); if(f.topluAcik) document.getElementById('gc-toplu-metin')?.focus(); return; }
  if(d.gctopluekle){
    const seriler=f.toplu.split(/[\r\n\t;]+/).map(x=>x.trim()).filter(Boolean);
    if(!seriler.length) return bildir('Eklenecek seri numarası yok.');
    const varOlan=new Set(f.tupler.map(x=>x.seri.trim()).filter(Boolean));
    const s=f.tupler[f.tupler.length-1]||{V:'50',P:'',T:'15'};
    f.tupler=f.tupler.filter(x=>x.seri.trim()||x.P);
    let eklenen=0; for(const sr of seriler){ if(varOlan.has(sr)) continue; varOlan.add(sr); const dk=sonDolumKaydi(sr); f.tupler.push(dk?kayittanTupSatiri(dk):{seri:sr,V:s.V,P:s.P,T:s.T,oto:true}); if(dk) f.tupler[f.tupler.length-1].seri=sr; eklenen++; }
    if(!f.tupler.length) f.tupler.push({seri:'',V:s.V,P:s.P,T:s.T});
    f.toplu=''; f.topluAcik=false; cizGcSayfasi(); const kayitli=seriler.filter(x=>sonDolumKaydi(x)).length; bildir(`${eklenen} tüp eklendi${seriler.length!==eklenen?', tekrar edenler atlandı':''}${kayitli?`; ${kayitli} tanesinin değerleri dolum kayıtlarından alındı`:''}.`); return;
  }
  if(t.id==='gc-kaydet'){
    gcHesapla();
    const tarih=kayitTarihi('gc'); if(tarih==null) return; S.gc.kayitTarihi=tarih;

    clearTimeout(gcRefZ); await kaydet(GCREF_ANAHTAR,S.gcRef); await saklaAnaliz(); sayaclar();
    S.gc.form=yeniGcForm(f); cizGcSayfasi();

    return;
  }
  if(t.id==='gc-vazgec'){ S.gc.form=yeniGcForm(f); cizGcSayfasi(); return; }
  if(t.id==='gc-temizle'){ const onceki=f; S.gc.form=yeniGcForm(); S.gc.form.satir=onceki.satir.map(r=>({...r,alan:Array(onceki.tekrar).fill('')})); S.gc.form.tekrar=onceki.tekrar; cizGcSayfasi(); bildir('Form temizlendi.',()=>{ S.gc.form=onceki; cizGcSayfasi(); }); return; }
  if(d.gcac){ S.gc.acik=S.gc.acik===d.gcac?null:d.gcac; cizGcListe(); if(S.gc.acik) cizGcDetay(d.gcac); else $('#gc-detay').innerHTML=''; return; }
  if(t.id==='gc-kapat'){ S.gc.acik=null; $('#gc-detay').innerHTML=''; cizGcListe(); return; }
  if(d.gcsil){
    const i=S.analizler.findIndex(x=>x.id===d.gcsil); if(i<0) return;
    const [silinen]=S.analizler.splice(i,1); S.silinenler[silinen.id]=Date.now(); if(S.gc.acik===silinen.id){ S.gc.acik=null; $('#gc-detay').innerHTML=''; }
    await saklaAnaliz(); sayaclar(); cizGcSayfasi();
    bildir('Analiz silindi.',async()=>{ silinen.guncel=Date.now(); S.analizler.push(silinen); await saklaAnaliz(); sayaclar(); if(S.sekme==='gc') cizGcSayfasi(); });
    return;
  }
  if(d.gcduzenle||d.gckopya){
    const a=S.analizler.find(x=>x.id===(d.gcduzenle||d.gckopya)); if(!a) return;
    const form={tarih:d.gcduzenle?tarihDegeri(olcumZamani(a)):'',tarihElle:!!d.gcduzenle,tarihHatali:false,musteri:a.musteri,analizNo:d.gcduzenle?a.analizNo:'',seriNo:d.gcduzenle?a.seriNo:'',partiNo:d.gcduzenle?a.partiNo:'',tekrar:a.tekrar,sartOn:a.sartOn,sP:a.sP,sT:a.sT,rP:a.rP,rT:a.rT,

      duzenle:d.gcduzenle?a.id:null,topluAcik:false,toplu:''};
    S.gc.form=form; S.gc.gorunum='yeni'; cizGcSayfasi(); window.scrollTo(0,0);
    bildir(d.gcduzenle?'Analiz düzenleme için açıldı.':'Bileşenler ve müşteri yeni analize aktarıldı.');
    return;
  }
  if(d.gcyazdir){ gcYazdir(d.gcyazdir); return; }
  if(t.id==='gc-csv'){ const l=gcFiltreli(); if(!l.length) return bildir('İndirilecek analiz yok.'); indir('gc-analizleri-'+new Date().toISOString().slice(0,10)+'.csv','\ufeff'+gcCsv(l),'text/csv;charset=utf-8'); bildir('CSV dosyası indirildi.'); return; }
});

// ---------- Olaylar ----------
function yaz(yol,deger){ const [a,b]=yol.split('.'); if(b===undefined){ S[a]=deger; return; } if(a==='tek'&&b==='oran'){ S.tek.oran[S.tek.gaz]=deger; return; } if(a==='tek'&&b==='ltol'){ S.tek.ltol[S.tek.gaz]=deger; return; } if(a==='tek'&&b==='test'){ S.tek.test[S.tek.gaz]=Number(deger); const o=TEST[S.tek.gaz].find(x=>x.p==deger); if(o) S.tek.oran[S.tek.gaz]=String(o.r).replace('.',','); cizTekGirdi(); return; } S[a][b]=deger; }

document.querySelector('.sekmeler').addEventListener('click',e=>{ const b=e.target.closest('[data-sekme]'); if(!b) return; S.sekme=b.dataset.sekme; ciz(); });
const hesapSekmesi=()=>S.sekme==='tek'||S.sekme==='karisim';
$('#ref').addEventListener('change',e=>{ S.ref=e.target.value; saklaAyar(); if(hesapSekmesi()) hesapla(); });
$('#olcum').addEventListener('change',e=>{ S.olcum=e.target.value; saklaAyar(); ciz(); });
$('#patm').addEventListener('input',e=>{ const v=num(e.target.value); if(v>0.5&&v<1.2){ S.patm=v; saklaAyar(); if(hesapSekmesi()) hesapla(); } });

kok.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.form){ S.form[t.dataset.form]=t.value; return; }
  if(t.dataset.filtre){ S.filtre.ara=t.value; cizKayitGovde(); return; }
  if(t.dataset.notform){ S.notForm[t.dataset.notform]=t.value; return; }
  if(t.dataset.notara){ S.notAra=t.value; cizNotGovde(); return; }
  if(t.dataset.bag && t.type!=='checkbox' && t.tagName!=='SELECT'){
    yaz(t.dataset.bag,t.value);
    const odak=t.id, bas=t.selectionStart, icSonuc=!!t.closest('#sonuc');
    hesapla();
    if(icSonuc){ const y=document.getElementById(odak); if(y){ y.focus(); try{y.setSelectionRange(bas,bas);}catch(_){} } }
  }
  if(t.dataset.ssatir!==undefined && t.dataset.salan==='v'){ S.kar.ssatir[+t.dataset.ssatir].v=t.value; hesapla(); return; }
  if(t.dataset.satir!==undefined && t.dataset.alan==='v'){
    const list=S.kar.mod==='basinc'?S.kar.satir:S.kar.ksatir; list[+t.dataset.satir].v=t.value;
    if(S.kar.mod==='basinc'){ const top=list.reduce((a,r)=>a+(num(r.v)||0),0); const el=$('#toplam'); if(el){ const bad=Math.abs(top-100)>1e-6; el.className='toplam'+(bad?' hatali':''); el.textContent=`Toplam %${fmt(top,3)}${bad?' (100 olmalı)':''}`; } }
    hesapla();
  }
});
kok.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='yedek-yukle' && t.files && t.files[0]){
    try{
      const veri=JSON.parse(await t.files[0].text());
      const kayit=Array.isArray(veri)?veri:(veri.kayitlar||[]), notlar=Array.isArray(veri)?[]:(veri.notlar||[]);
      const varK=new Set(S.kayit.map(r=>r.id)), varN=new Set(S.notlar.map(n=>n.id));
      let yk=0, yn=0, ya=0;
      const varA=new Set(S.analizler.map(a=>a.id));
      if(!Array.isArray(veri)){ for(const a of (veri.analizler||[])){ if(a&&a.id&&Array.isArray(a.sonuc)&&!varA.has(a.id)){ S.analizler.push(a); ya++; } }
        for(const [k,v] of Object.entries(veri.gcReferanslari||{})){ if(v&&(!S.gcRef[k]||(v.tarih||0)>(S.gcRef[k].tarih||0))) S.gcRef[k]=v; } }
      for(const r of kayit){ if(r && typeof r.m3==='number'){ if(!r.id) r.id=kimlik(); if(!varK.has(r.id)){ S.kayit.push(r); yk++; } } }
      for(const n of notlar){ if(n && typeof n.metin==='string'){ if(!n.id) n.id=kimlik(); if(!varN.has(n.id)){ S.notlar.push(n); yn++; } } }
      await saklaKayit(); await saklaNot(); await saklaAnaliz(); await kaydet(GCREF_ANAHTAR,S.gcRef); sayaclar(); cizKayitSayfasi();
      bildir(`Yedekten ${yk} dolum kaydı, ${ya} analiz ve ${yn} not eklendi. Zaten var olanlar atlandı.`);
    }catch(_){ bildir('Dosya okunamadı. Bu programdan alınmış bir yedek dosyası seçin.'); }
    t.value=''; return;
  }
  if(t.type==='checkbox'&&t.dataset.bag){ yaz(t.dataset.bag,t.checked); S.sekme==='tek'?cizTekGirdi():cizKarGirdi(); hesapla(); return; }
  if(t.tagName==='SELECT'&&t.dataset.bag){ yaz(t.dataset.bag,t.value); hesapla(); return; }
  if(t.dataset.ssatir!==undefined){
    const r=S.kar.ssatir[+t.dataset.ssatir], a=t.dataset.salan;
    if(a==='k'){ if(S.kar.ssatir.some((x,j)=>j!==+t.dataset.ssatir&&x.k===t.value)){ bildir(`${GAZ[t.value].ad} zaten listede.`); cizKarGirdi(); return; } r.k=t.value; }
    else if(a==='u') r.u=t.value;
    else if(a==='d'){ S.kar.ssatir.forEach((x,j)=>{ x.d = j===+t.dataset.ssatir ? t.checked : false; }); }
    cizKarGirdi(); hesapla(); return;
  }
  if(t.tagName==='SELECT'&&t.dataset.satir!==undefined){ const list=S.kar.mod==='basinc'?S.kar.satir:S.kar.ksatir; list[+t.dataset.satir].k=t.value; cizKarGirdi(); hesapla(); }
});
kok.addEventListener('click',async e=>{
  const t=e.target.closest('button'); if(!t) return;
  const d=t.dataset;
  if(d.gaz){ S.tek.gaz=d.gaz; cizTekGirdi(); hesapla(); return; }
  if(d.mod){ S.kar.mod=d.mod; cizKarGirdi(); hesapla(); return; }
  if(d.donem){ S.filtre.donem=d.donem; document.querySelectorAll('[data-donem]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.donem===d.donem)); cizKayitGovde(); return; }
  const sl=S.kar.ssatir;
  if(d.sekle){ const bos=KARISIM_GAZ.find(g=>!sl.some(r=>r.k===g)); const dIdx=sl.findIndex(r=>r.d); const yeni={k:bos||'N2',v:'',u:'mol',d:false}; if(dIdx>=0) sl.splice(dIdx,0,yeni); else sl.push(yeni); cizKarGirdi(); hesapla(); return; }
  if(d.skaldir!==undefined){ sl.splice(+d.skaldir,1); cizKarGirdi(); hesapla(); return; }
  if(d.syukari!==undefined){ const i=+d.syukari; [sl[i-1],sl[i]]=[sl[i],sl[i-1]]; cizKarGirdi(); hesapla(); return; }
  if(d.sasagi!==undefined){ const i=+d.sasagi; [sl[i+1],sl[i]]=[sl[i],sl[i+1]]; cizKarGirdi(); hesapla(); return; }
  if(t.id==='siparis-gc'){
    const r=S.kar.sonTasarim; if(!r) return;
    const f=yeniGcForm(); f.musteri=S.form.musteri||'';
    const baskin=r.parts.reduce((m,p)=>p.x>m.x?p:m,r.parts[0]);
    const dengeKey=(r.parts.find(p=>p.denge)||baskin).key;
    f.satir=r.parts.filter(p=>p.key!=='C2H2').map(p=>gcSatir(p.key,String(+(p.x*100).toFixed(p.x<0.01?6:4)).replace('.',','),'',p.key===dengeKey,f.tekrar));
    S.gc.form=f; S.gc.gorunum='yeni'; S.sekme='gc'; ciz(); window.scrollTo(0,0);
    bildir('Sipariş bileşimi GC analizine nominal değer olarak aktarıldı; toleransları girin.');
    return;
  }
  const list=S.kar.mod==='basinc'?S.kar.satir:S.kar.ksatir;
  if(d.hazir!==undefined){ S.kar.satir=HAZIR[+d.hazir].r.map(([k,v])=>({k,v:String(v)})); S.kar.ksatir=S.kar.satir.map(r=>({k:r.k,v:''})); cizKarGirdi(); hesapla(); return; }
  if(d.ekle){ const bos=KARISIM_GAZ.find(g=>!list.some(r=>r.k===g)); list.push({k:bos||'N2',v:''}); cizKarGirdi(); hesapla(); return; }
  if(d.kaldir!==undefined){ list.splice(+d.kaldir,1); cizKarGirdi(); hesapla(); return; }
  if(d.yukari!==undefined){ const i=+d.yukari; [list[i-1],list[i]]=[list[i],list[i-1]]; cizKarGirdi(); hesapla(); return; }
  if(d.asagi!==undefined){ const i=+d.asagi; [list[i+1],list[i]]=[list[i],list[i+1]]; cizKarGirdi(); hesapla(); return; }
  if(d.denge){ const n=list.length-1; const diger=list.slice(0,n).reduce((a,r)=>a+(num(r.v)||0),0); list[n].v=String(+(100-diger).toFixed(6)).replace('.',','); cizKarGirdi(); hesapla(); return; }

  if(t.id==='kaydet'){
    if(!sonHesap) return;
    const tarih=kayitTarihi('form'); if(tarih==null) return;
    const ts=Date.now();
    S.kayit.push({...sonHesap,refKey:S.ref,olcum:S.olcum,patm:S.patm,id:kimlik(),ts,tarih,zaman:tarihMetni(tarih),ref:REF[S.ref].ad,tupNo:S.form.tup.trim(),musteri:S.form.musteri.trim(),not:S.form.not.trim()});
    S.form.tup=''; S.form.not='';
    const a=document.getElementById('form.tup'), b=document.getElementById('form.not'); if(a) a.value=''; if(b) b.value='';
    await saklaKayit(); sayaclar(); bildir(`Kaydedildi (${tarihMetni(tarih)}). Toplam ${S.kayit.length} kayıt.`);
    if(a) a.focus();
    return;
  }
  if(d.kayitdetay){ S.acikKayit=S.acikKayit===d.kayitdetay?null:d.kayitdetay; cizKayitGovde(); return; }
  if(d.analizac){ S.sekme='gc'; S.gc.gorunum='kayitlar'; S.gc.ara=''; S.gc.acik=d.analizac; ciz(); cizGcDetay(d.analizac); return; }
  if(d.sil!==undefined){
    const i=S.kayit.findIndex(r=>r.id===d.sil); if(i<0) return;
    const [silinen]=S.kayit.splice(i,1); S.silinenler[silinen.id]=Date.now(); await saklaKayit(); sayaclar(); cizKayitGovde();
    bildir('Kayıt silindi.',async()=>{ silinen.guncel=Date.now(); S.kayit.push(silinen); await saklaKayit(); sayaclar(); cizKayitGovde(); });
    return;
  }
  if(t.id==='temizle'){
    const liste=filtreliKayitlar(); if(!liste.length) return;
    if(!confirm(`${liste.length} kayıt silinsin mi?`)) return;
    const ids=new Set(liste.map(r=>r.id)), yedek=S.kayit.slice();
    const an=Date.now(); ids.forEach(id=>{ S.silinenler[id]=an; }); S.kayit=S.kayit.filter(r=>!ids.has(r.id)); await saklaKayit(); sayaclar(); cizKayitGovde();
    bildir(`${liste.length} kayıt silindi.`,async()=>{ const g=Date.now(); yedek.forEach(r=>{ if(ids.has(r.id)) r.guncel=g; }); S.kayit=yedek; await saklaKayit(); sayaclar(); cizKayitGovde(); });
    return;
  }
  if(t.id==='csv'){ const l=filtreliKayitlar().slice().sort((a,b)=>olcumZamani(b)-olcumZamani(a)); if(!l.length) return bildir('İndirilecek kayıt yok.'); indir('dolum-kayitlari-'+new Date().toISOString().slice(0,10)+'.csv','\ufeff'+csvMetni(';',l),'text/csv;charset=utf-8'); bildir('CSV dosyası indirildi.'); return; }
  if(t.id==='kopyala'){
    const l=filtreliKayitlar().slice().sort((a,b)=>olcumZamani(b)-olcumZamani(a)); if(!l.length) return bildir('Kopyalanacak kayıt yok.');
    try{ await navigator.clipboard.writeText(csvMetni('\t',l)); bildir('Tablo panoya kopyalandı; Excel\'e yapıştırabilirsiniz.'); }
    catch(_){ bildir('Pano erişimi engellendi. CSV indir seçeneğini kullanın.'); }
    return;
  }
  if(t.id==='yedek-al'){ indir('gaz-dolum-yedek-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({surum:2,tarih:new Date().toISOString(),kayitlar:S.kayit,notlar:S.notlar,analizler:S.analizler,gcReferanslari:S.gcRef,ayarlar:{ref:S.ref,olcum:S.olcum,patm:S.patm}},null,1),'application/json'); bildir('Yedek dosyası indirildi.'); return; }

  // notlar
  if(t.id==='not-kaydet'){
    const f=S.notForm, metin=f.metin.trim(), baslik=f.baslik.trim();
    if(!metin && !baslik){ bildir('Boş not kaydedilmez.'); document.getElementById('not-metin')?.focus(); return; }
    const simdi=Date.now();
    if(f.duzenle){ const n=S.notlar.find(x=>x.id===f.duzenle); if(n){ n.baslik=baslik; n.metin=metin; n.guncel=simdi; } }
    else S.notlar.push({id:kimlik(),baslik,metin,ts:simdi,guncel:simdi});
    const duzenlendi=!!f.duzenle;
    S.notForm={baslik:'',metin:'',duzenle:null};
    await saklaNot(); sayaclar(); cizNotSayfasi(); bildir(duzenlendi?'Not güncellendi.':'Not kaydedildi.');
    return;
  }
  if(t.id==='not-vazgec'){ S.notForm={baslik:'',metin:'',duzenle:null}; cizNotSayfasi(); return; }
  if(d.notduzenle){ const n=S.notlar.find(x=>x.id===d.notduzenle); if(!n) return; S.notForm={baslik:n.baslik,metin:n.metin,duzenle:n.id}; cizNotSayfasi(); const m=document.getElementById('not-metin'); if(m){ m.focus(); m.setSelectionRange(m.value.length,m.value.length); m.scrollIntoView({block:'center'}); } return; }
  if(d.notsil){
    const i=S.notlar.findIndex(x=>x.id===d.notsil); if(i<0) return;
    const [silinen]=S.notlar.splice(i,1); S.silinenler[silinen.id]=Date.now(); if(S.notForm.duzenle===silinen.id) S.notForm={baslik:'',metin:'',duzenle:null};
    await saklaNot(); sayaclar(); cizNotSayfasi();
    bildir('Not silindi.',async()=>{ silinen.guncel=Date.now(); S.notlar.push(silinen); await saklaNot(); sayaclar(); if(S.sekme==='notlar') cizNotSayfasi(); });
    return;
  }
});
kok.addEventListener('keydown',e=>{ if(e.target.id==='not-metin' && (e.ctrlKey||e.metaKey) && e.key==='Enter'){ e.preventDefault(); document.getElementById('not-kaydet')?.click(); } });

let boyutZ; window.addEventListener('resize',()=>{ clearTimeout(boyutZ); boyutZ=setTimeout(()=>{ if(bekleyenGrafik) Gorsel.grafik($('#grafik'),bekleyenGrafik); },150); });

window.__gazDolumKlasorBagla=h=>klasorBagla(h);
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && document.querySelector('link[rel="manifest"]')){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
(async function baslat(){
  Depo.hazirla();
  const [k,n,a,an,gr]=await Promise.all([Depo.oku(KAYIT_ANAHTAR),Depo.oku(NOT_ANAHTAR),Depo.oku(AYAR_ANAHTAR),Depo.oku(ANALIZ_ANAHTAR),Depo.oku(GCREF_ANAHTAR)]);
  if(Array.isArray(an)) S.analizler=an;
  if(gr&&typeof gr==='object') S.gcRef=gr;
  S.gc.form=yeniGcForm();
  if(Array.isArray(k)) S.kayit=k.map(r=>({...r,id:r.id||kimlik(),ts:r.ts||Date.now()}));
  else { const eski=await Depo.oku('dolum-kayitlari'); if(Array.isArray(eski)) S.kayit=eski.map(r=>({...r,id:kimlik(),ts:Date.now(),not:r.not||''})); }
  if(Array.isArray(n)) S.notlar=n;
  ayarlariUygula(a);
  if(Klasor.kullanilabilir){
    const h=await idbAl('klasor');
    if(h){
      Klasor.handle=h; Klasor.ad=h.name;
      let p='prompt'; try{ p=await klasorIzni(h,false); }catch(_){}
      if(p==='granted'){
        try{
          const m=await klasorOku(h);
          const tarayicidaVeri=S.kayit.length||S.notlar.length||S.analizler.length;
          Klasor.durum='bagli';
          if(m.veri){ birlestir(m.veri); ayarlariUygula(m.veri.ayarlar); }
          Klasor.sonBilinen=m.zaman;
          if(tarayicidaVeri||!m.veri){ Klasor.zincir=Klasor.zincir.then(klasoreYazIs); await Klasor.zincir; if(Klasor.durum==='bagli') await tarayiciVerisiniTemizle(); }
        }catch(e){ Klasor.durum=(e.name==='NotAllowedError'||e.name==='SecurityError')?'izin':'hata'; Klasor.hataMesaji=e.name==='NotFoundError'?'Klasör bulunamadı; taşınmış ya da silinmiş olabilir.':(e.message||String(e)); }
      }else Klasor.durum='izin';
    }
  }
  ciz(); durumCiz();
})();
})();
